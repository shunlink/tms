# Full-stack deployment: Next.js app + PostgreSQL + Redis.
#
# For local dev with the app on the host:
#   docker compose up -d db redis
#
# For the whole stack in Docker:
#   docker compose up -d --build
#   docker compose exec app npm run db:seed

services:

  pgbouncer:
    image: edoburu/pgbouncer:1.21.0-p0
    environment:
      DATABASE_URL: "postgresql://postgres:0000@db:5432/tms"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - production

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--bind", "0.0.0.0", "--port", "6379"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tms_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: tms
    ports:
      - "5433:5432"
    volumes:
      - tms_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:0000@db:5432/tms?schema=public"
      DIRECT_URL: "postgresql://postgres:0000@db:5432/tms?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-me-in-production}"
      NOTIFY_PROVIDER: "console"
      STORAGE_DRIVER: "local"
      MAPS_PROVIDER: "nominatim"
    volumes:
      - tms_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  tms_db:
  tms_uploads:
  tms_redis: