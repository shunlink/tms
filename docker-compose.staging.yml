# Staging / pre-production stack — isolated from live (separate volumes + ports).
#
# First time:
#   cp .env.staging.example .env.staging
#   # Edit secrets, URLs, Resend, WhatsApp (use test credentials)
#   ln -sf .env.staging .env
#   docker compose -f docker-compose.staging.yml up -d --build
#
# Same VPS as production: keep this in a separate directory (e.g. /opt/tms-staging)
# so ports 3001 / 5434 / 6380 do not clash with live 3000 / 5432 / 6379.
#
# Compose loads `.env` for ${VAR} substitution — symlink .env.staging → .env on the server.

name: tms-staging

services:
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0-p0
    env_file:
      - .env.staging
    environment:
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 10
    ports:
      - "127.0.0.1:6433:5432"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - scaled
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--bind", "0.0.0.0", "--port", "6379"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - tms_staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env.staging
    environment:
      POSTGRES_USER: tms_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tms_staging_change_me}
      POSTGRES_DB: tms_staging
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tms_staging_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms_staging -d tms_staging"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.staging
    environment:
      REDIS_URL: redis://redis:6379
      HOSTNAME: 0.0.0.0
      CHROME_PATH: /usr/bin/chromium
    volumes:
      - tms_staging_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker-email:
    build: .
    command: ["npm", "run", "worker:email"]
    env_file:
      - .env.staging
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tms_staging_db:
  tms_staging_uploads:
  tms_staging_redis:
