# Production Docker stack (committed — safe to ship in deploy zip).
#
# On the VPS (first time or after compose was deleted):
#   cp docker-compose.production.yml docker-compose.yml
#   cp .env.production.example .env.production   # if needed, then edit secrets
#   docker compose up -d --build
#
# Or without copying:
#   docker compose -f docker-compose.production.yml up -d --build
#
# Deploying new app code: use scripts/vps-apply-deploy.sh so .env and docker-compose.yml
# on the server are never overwritten.
#
# Compose only auto-loads `.env` for ${VAR} substitution — not `.env.production`.
# On VPS:  ln -sf .env.production .env
# Or:      docker compose --env-file .env.production up -d --build

services:
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0-p0
    env_file:
      - .env.production
    environment:
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - scaled
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--bind", "0.0.0.0", "--port", "6379"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tms_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tms_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379
      HOSTNAME: 0.0.0.0
      CHROME_PATH: /usr/bin/chromium
    volumes:
      - tms_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker-email:
    build: .
    command: ["npm", "run", "worker:email"]
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tms_db:
  tms_uploads:
  tms_redis:
